# Checks which Vercel address serves a correctly configured build (Supabase address built in) and
# posts the result as the commit status "site-probe". Reads public pages only.
name: Probe live sites
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-sites.yml']
  workflow_dispatch:
permissions: { contents: read, statuses: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - run: |
          out=""
          for host in super-kirana-niphad.vercel.app; do
            code=$(curl -s -D head.txt -o page.html -w "%{http_code}" "https://$host/login"); srv=$(grep -i "^x-vercel-error\|^set-cookie: _vercel_sso\|^www-authenticate" head.txt | head -1 | tr -d "\r" | cut -c1-60)
            ok=$(grep -i '^content-security-policy' head.txt | grep -q 'fzodhlpppcdiqonevmgy.supabase.co' && echo csp-yes || echo csp-no)
            js=0; for f in $(grep -o '/_next/static/[^"]*\.js' page.html | sort -u); do curl -s "https://$host$f" | grep -q 'fzodhlpppcdiqonevmgy' && js=$((js+1)); done
            ok="$ok,js$js"
            out="$out ${host%%.vercel.app}=$code/$ok [$srv];"
            echo "$host http=$code supabase-url-in-build=$ok"
          done
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=site-probe -f description="${out:0:139}"
