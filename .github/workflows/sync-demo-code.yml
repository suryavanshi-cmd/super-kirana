# Makes the DEMO_CODE repository secret the demo shop's code. Only the SHA-256 of the code (upper-
# case, spaces removed — exactly as the sign-in function compares it) is written to the database;
# the code itself is never printed, stored in the repo or logged. Run it again after changing the secret.
name: Sync demo code
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-demo-code.yml']
  workflow_dispatch:
permissions: { contents: read, statuses: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DEMO_CODE: ${{ secrets.DEMO_CODE }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PROJECT_REF: fzodhlpppcdiqonevmgy
    steps:
      - run: |
          set -euo pipefail
          status() { gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$1" -f context=demo-code -f description="$2" >/dev/null; }
          if [ -z "$DEMO_CODE" ]; then status failure "DEMO_CODE secret is missing"; exit 1; fi
          hash=$(printf '%s' "$DEMO_CODE" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' | sha256sum | cut -d' ' -f1)
          body=$(jq -n --arg h "$hash" '{query: ("update public.demo_access set code_hash = '\''" + $h + "'\'', updated_at = now() where id = 1 returning id")}')
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body")
          if [ "$code" -ge 300 ]; then status failure "update failed: HTTP $code"; exit 1; fi
          status success "demo code now matches the DEMO_CODE secret"
