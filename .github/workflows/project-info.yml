# Reads the Supabase project's region and status and posts them as a commit status
# (visible on the commit page). Uses the same SUPABASE_ACCESS_TOKEN secret; prints no secrets.
name: Supabase project info

on:
  push:
    branches: [main]
    paths: ['.github/workflows/project-info.yml']
  workflow_dispatch:

permissions: { contents: read, statuses: write }

jobs:
  info:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PROJECT_REF: fzodhlpppcdiqonevmgy
    steps:
      - name: Read project info and post it
        run: |
          info=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            | jq -r '"region=\(.region) status=\(.status) db=\(.database.version // "?")"')
          echo "$info" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=supabase-project -f description="$info"
